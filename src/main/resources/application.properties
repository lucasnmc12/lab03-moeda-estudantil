spring.application.name=moeda-estudantil
spring.datasource.url=${DB_URL:jdbc:h2:file:./dados/moeda}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
moeda.email.remetente=${SMTP_FROM:moeda@localhost}
moeda.jobs.ativos=${JOBS_ATIVOS:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
